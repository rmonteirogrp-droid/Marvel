# Déploiement automatique : Netlify publie le dossier « site » à chaque mise à jour de la branche.
[build]
  publish = "site"
  command = ""
  # Pas de déploiement (ni de crédits consommés) quand l'envoi ne change ni l'appli (site/) ni la sauvegarde (netlify/) :
  # planche de personnages, maquettes, sources… ne relancent plus de mise en ligne.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify/ netlify.toml package.json"

# L'appli et son service worker sont toujours revérifiés, pour que « Recharger » trouve la dernière version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
# Photos HD des personnages : l'adresse change avec l'image (?v=empreinte), on peut les garder longtemps.
[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Images, vidéos et sons de l'app : le nom du fichier est son empreinte, il ne change jamais.
[[headers]]
  for = "/m/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
